version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: saas_postgres_v2
    environment:
      POSTGRES_USER: admin_v2
      POSTGRES_PASSWORD: password_v2
      POSTGRES_DB: saas_db_v2
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: saas_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@saas.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres_db
    restart: unless-stopped

volumes:
  postgres_data_v2: