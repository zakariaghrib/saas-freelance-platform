spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/saas_db_v2
    username: admin_v2
    password: password_v2
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080